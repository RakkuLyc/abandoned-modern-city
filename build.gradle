plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
            // Automated in-world test battery (see command/SelfTest):
            //   ./gradlew runServer -PselfTest=<report.txt>
            // generates fixed regions of the world, audits the blocks and stops the server.
            if (project.hasProperty('selfTest')) {
                systemProperty 'amcs.selftest', project.property('selfTest')
            }
            if (project.hasProperty('selfTestScope')) {
                systemProperty 'amcs.selftest.scope', project.property('selfTestScope')
            }
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Unit tests cover the pure planner (package core): no game bootstrap needed.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '3G'
    systemProperty 'amcs.renderDir', layout.buildDirectory.dir('test-renders').get().asFile.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// the GPL asks that every copy carry the license: the jar holds LICENSE (with the additional terms)
tasks.named('jar', Jar).configure {
    from('LICENSE')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
